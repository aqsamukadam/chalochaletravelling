                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="chalochale-travel-app/about.html">

                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="chalochale-travel-app/destinations.html">

                    <li class="nav-item">
                        <a class="nav-link" href="chalochale-travel-app/packages.html">

    <section class="py-5 bg-light text-center">
        <div class="container">
            <h1 class="fw-bold">Travel Booking Form</h1>
            <p class="lead">Fill the form and Submit Your Travel request</p>
        </div>

    </section>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card shadow-lg p-4 rounded-4">
                        <h3 class="fw-bold mb-4 text-center">Book your Trip</h3>
                        <form class="row g-3">
                            <div class="col-md-6">
                                <label for="inputEmail4" class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter Your Name">
                            </div>
                            <div class="col-md-6">
                                <label for="inputPassword4" class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Enter Your Email">
                            </div>
                             <div class="col-md-6">
                                <label for="inputState" class="form-label">Select Destination</label>
                                <select id="inputState" class="form-select">
                                    <option selected>Goa</option>
                                    <option>Manali</option>
                                    <option>Jaipur</option>
                                    <option>Kerla</option>
                                    <option>Agra</option>
                                </select>
                            </div>
                             <div class="col-md-6">
                                <label for="traveldate" class="form-label">Travel Date</label>
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-12">
                                <label for="numberofpeople" class="form-label">Number Of People</label>
                                <input type="number" class="form-control"  placeholder="Enter Number of people">
                            </div>
                            <div class="col-12">
                                <label for="message" class="form-label">Message/Requirment</label>
                                <textarea class="form-control" rows="4" placeholder="Enter any Travel Requirment"></textarea>
                            </div>
                           
                           

                        
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary w-100"  >Submit booking Request</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
