<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>ChaloChale - Sign Up</title>
    
    <style>
        :root {
            --primary-teal: #7AB3B8;
            --luxury-beige: #D0B89D;
            --ivory: #F8F5EF;
            --soft-white: #FFFFFF;
            --deep-charcoal: #243033;
            --muted-text: #6B7476;
            --light-teal: #EAF3F3;
            --border-radius: 20px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --card-shadow: 0 10px 40px rgba(36, 48, 51, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--ivory);
            color: var(--deep-charcoal);
            min-height: 100vh;
        }

        /* Premium Navbar */
        .navbar {
            background: rgba(248, 245, 239, 0.85);
            backdrop-filter: blur(20px);
            padding: 1.2rem 0;
            transition: var(--transition);
            border-bottom: 1px solid rgba(122, 179, 184, 0.1);
        }

        .navbar.scrolled {
            background: rgba(248, 245, 239, 0.98);
            box-shadow: 0 4px 30px rgba(36, 48, 51, 0.1);
            padding: 0.8rem 0;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            color: var(--deep-charcoal) !important;
            font-weight: 700;
            transition: var(--transition);
        }

        .navbar-brand:hover {
            color: var(--primary-teal) !important;
        }

        .nav-link {
            color: var(--deep-charcoal) !important;
            font-weight: 500;
            padding: 0.8rem 1.5rem !important;
            position: relative;
            transition: var(--transition);
            border-radius: 8px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary-teal) !important;
            background: rgba(122, 179, 184, 0.08);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--primary-teal);
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 60%;
        }

        .btn-premium {
            background: var(--primary-teal);
            border: none;
            color: var(--soft-white);
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(122, 179, 184, 0.3);
        }

        .btn-premium:hover {
            background: var(--deep-charcoal);
            color: var(--soft-white);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(122, 179, 184, 0.4);
        }

        .btn-outline-premium {
            background: transparent;
            border: 2px solid var(--primary-teal);
            color: var(--primary-teal);
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            transition: var(--transition);
        }

        .btn-outline-premium:hover {
            background: var(--primary-teal);
            color: var(--soft-white);
            transform: translateY(-3px);
        }

        /* Signup Section */
        .signup-section {
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, var(--ivory) 0%, var(--light-teal) 100%);
            padding: 4rem 0;
            position: relative;
            overflow: hidden;
        }

        .signup-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="%237AB3B8" stroke-width="0.5" opacity="0.08"/></svg>');
            background-size: 100px 100px;
            opacity: 0.5;
        }

        .signup-card {
            background: var(--soft-white);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 3rem;
            border: 1px solid rgba(122, 179, 184, 0.1);
            position: relative;
            z-index: 1;
        }

        .signup-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-teal), var(--luxury-beige));
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .signup-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--deep-charcoal);
            margin-bottom: 0.5rem;
            font-weight: 700;
            text-align: center;
        }

        .signup-subtitle {
            color: var(--muted-text);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-label {
            color: var(--deep-charcoal);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 1px solid rgba(122, 179, 184, 0.3);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            transition: var(--transition);
            background: var(--ivory);
        }

        .form-control:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(122, 179, 184, 0.1);
            background: var(--soft-white);
        }

        .btn-signup {
            background: linear-gradient(135deg, var(--primary-teal), var(--luxury-beige));
            border: none;
            color: var(--soft-white);
            font-weight: 700;
            padding: 1rem 2rem;
            border-radius: 30px;
            transition: var(--transition);
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 8px 25px rgba(122, 179, 184, 0.4);
        }

        .btn-signup:hover {
            background: linear-gradient(135deg, var(--luxury-beige), var(--primary-teal));
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(122, 179, 184, 0.5);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--muted-text);
        }

        .login-link a {
            color: var(--primary-teal);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-link a:hover {
            color: var(--luxury-beige);
        }

        @media (max-width: 768px) {
            .signup-card {
                padding: 2rem;
            }

            .signup-title {
                font-size: 2rem;
            }

            .navbar-brand {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">

            <a class="navbar-brand" href="index1.html">
                <i class="fa-solid fa-plane-departure me-2"></i>
                ChaloChale
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                aria-controls="menu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index1.html">
                            <i class="fa-solid fa-home me-1"></i> Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="chalochale-travel-app/destinations.html">
                            <i class="fa-solid fa-map-marked-alt me-1"></i> Destinations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="chalochale-travel-app/packages.html">
                            <i class="fa-solid fa-suitcase me-1"></i> Packages
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="chalochale-travel-app/booking.html">
                            <i class="fa-solid fa-calendar-check me-1"></i> Booking
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="chalochale-travel-app/contact.html">
                            <i class="fa-solid fa-envelope me-1"></i> Contact
                        </a>
                    </li>

                </ul>

                <div class="d-flex gap-2 ms-lg-3">
                    <a href="#" class="btn-premium">
                        <i class="fa-solid fa-user me-2"></i> Login
                    </a>
                    <a href="signup.html" class="btn-outline-premium active">
                        <i class="fa-solid fa-user-plus me-2"></i> Sign Up
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <section class="signup-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="signup-card">
                        <h2 class="signup-title">Create Account</h2>
                        <p class="signup-subtitle">Join ChaloChale and start your luxury travel journey</p>

                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Create a password">
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password">
                            </div>
                            
                            <button type="submit" class="btn-signup">Create Account</button>

                            <p class="login-link">Already have an account? <a href="#">Login here</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        // Navbar Scroll Effect
        const navbar = document.querySelector('.navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>

</body>

</html>
